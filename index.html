<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestLife - RPG To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        };
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body {
            background-image:
                radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 30%),
                linear-gradient(to bottom, #0f172a, #111827 40%, #0f172a);
        }
        ::selection {
            background: rgba(99, 102, 241, 0.4);
            color: white;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen pb-20 md:pb-6">
    <div class="max-w-md mx-auto p-4 sm:p-6">
        <header class="bg-dark-800 border border-slate-700 rounded-2xl p-4 shadow-lg mb-6">
            <div class="mb-3 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-amber-500 px-3 py-2 text-center shadow-lg shadow-indigo-900/30">
                <p class="text-[10px] font-black uppercase tracking-[0.22em] text-indigo-100/90">Реклама</p>
                <p class="text-xs font-bold text-white">QuestLife PRO • Plus de récompenses, plus de vitesse</p>
            </div>

            <div class="flex justify-between items-center mb-3 gap-3">
                <div>
                    <h1 id="char-title" class="text-xl font-black text-amber-400">Niveau 1 • Guerrier</h1>
                    <span id="pro-badge" class="text-xs bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded-full">Gratuit</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1 bg-dark-900 px-3 py-1.5 rounded-xl border border-slate-700">
                        <span class="text-amber-400 font-bold">🪙</span>
                        <span id="gold-count" class="font-bold text-amber-300">100</span>
                    </div>
                    <button id="reset-btn" type="button" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold px-2 py-1.5 rounded-lg transition">
                        Reset
                    </button>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Expérience (XP)</span>
                    <span id="xp-text">0 / 100 XP</span>
                </div>
                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden p-0.5 border border-slate-600">
                    <div id="xp-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <section class="mb-6">
            <h2 class="text-lg font-bold mb-3 flex items-center gap-2">📜 Nouvelles Quêtes</h2>
            <div class="flex gap-2">
                <input
                    type="text"
                    id="questInput"
                    placeholder="Nom de la nouvelle quête..."
                    class="bg-dark-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    maxlength="80"
                >
                <button id="addQuestBtn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">
                    Créer
                </button>
            </div>
        </section>

        <section class="mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Quêtes Actives</h3>
            <ul id="quest-list" class="space-y-2"></ul>
        </section>

        <section class="mb-6">
            <button id="dailyRewardBtn" type="button" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition">
                🎁 Собрать награду за посещение (+50 XP, +15 ОР)
            </button>
        </section>

        <section>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Boutique du Mage</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-dark-800 border border-slate-700 p-3.5 rounded-xl flex flex-col justify-between">
                    <div>
                        <div class="text-2xl mb-1">🧪</div>
                        <h4 class="font-bold text-sm">Potion de Sagesse</h4>
                        <p class="text-xs text-slate-400 mb-3">+50 XP instantané</p>
                    </div>
                    <button type="button" data-item="Potion de Sagesse" data-cost="30" class="buy-item w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs transition">
                        30 🪙
                    </button>
                </div>

                <div class="bg-dark-800 border border-slate-700 p-3.5 rounded-xl flex flex-col justify-between">
                    <div>
                        <div class="text-2xl mb-1">⚔️</div>
                        <h4 class="font-bold text-sm">Épée Magique</h4>
                        <p class="text-xs text-slate-400 mb-3">Statut Légendaire</p>
                    </div>
                    <button type="button" data-item="Épée Magique" data-cost="100" class="buy-item w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs transition">
                        100 🪙
                    </button>
                </div>
            </div>

            <button id="buyProBtn" type="button" class="w-full mt-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-orange-500/20">
                👑 Activer QuestLife PRO (200 🪙)
            </button>
        </section>
    </div>

    <div id="toast" class="fixed left-1/2 bottom-6 -translate-x-1/2 pointer-events-none opacity-0 transition-all duration-300 bg-slate-800 border border-slate-600 text-slate-100 px-4 py-2 rounded-full text-sm font-medium shadow-xl">
        message
    </div>

    <script>
        const STORAGE_KEY = 'questlife-save-v1';
        const DAILY_REWARD_MS = 24 * 60 * 60 * 1000;

        function makeId() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return `quest-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function getBaseState() {
            return {
                xp: 0,
                maxXp: 100,
                level: 1,
                gold: 100,
                isPro: false,
                dailyRewardAt: 0,
                quests: [
                    { id: makeId(), text: 'Faire du sport (30 min)', xpReward: 50, goldReward: 15, completed: false },
                    { id: makeId(), text: 'Lire 10 pages d\'un livre', xpReward: 40, goldReward: 15, completed: false }
                ]
            };
        }

        function normalizeQuest(quest) {
            return {
                id: typeof quest?.id === 'string' && quest.id ? quest.id : makeId(),
                text: String(quest?.text || '').trim() || 'Quête sans nom',
                xpReward: Number.isFinite(Number(quest?.xpReward)) ? Number(quest.xpReward) : 0,
                goldReward: Number.isFinite(Number(quest?.goldReward)) ? Number(quest.goldReward) : 0,
                completed: Boolean(quest?.completed)
            };
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return getBaseState();

                const parsed = JSON.parse(saved);
                const base = getBaseState();
                const quests = Array.isArray(parsed?.quests) && parsed.quests.length
                    ? parsed.quests.map(normalizeQuest)
                    : base.quests;

                return {
                    ...base,
                    ...parsed,
                    xp: Number.isFinite(Number(parsed?.xp)) ? Number(parsed.xp) : base.xp,
                    maxXp: Number.isFinite(Number(parsed?.maxXp)) ? Number(parsed.maxXp) : base.maxXp,
                    level: Number.isFinite(Number(parsed?.level)) ? Number(parsed.level) : base.level,
                    gold: Number.isFinite(Number(parsed?.gold)) ? Number(parsed.gold) : base.gold,
                    isPro: Boolean(parsed?.isPro),
                    dailyRewardAt: Number.isFinite(Number(parsed?.dailyRewardAt)) ? Number(parsed.dailyRewardAt) : 0,
                    quests
                };
            } catch (error) {
                return getBaseState();
            }
        }

        let gameState = loadState();

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch (error) {
                console.warn('Impossible de sauvegarder l\'état:', error);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(showToast.timeoutId);
            showToast.timeoutId = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);
        }

        function formatRemainingTime(ms) {
            const totalMinutes = Math.max(0, Math.ceil(ms / 60000));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return `${hours}ч ${minutes}м`;
        }

        function updateDailyRewardButton() {
            const button = document.getElementById('dailyRewardBtn');
            const now = Date.now();
            const available = !gameState.dailyRewardAt || now >= gameState.dailyRewardAt;

            if (available) {
                button.textContent = '🎁 Собрать награду за посещение (+50 XP, +15 ОР)';
                button.disabled = false;
                button.className = 'w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition';
                return;
            }

            const remaining = gameState.dailyRewardAt - now;
            button.textContent = `⏳ Награда будет доступна через ${formatRemainingTime(remaining)}`;
            button.disabled = true;
            button.className = 'w-full bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-xl shadow-lg shadow-slate-800/20 transition cursor-not-allowed opacity-75';
        }

        function addXp(amount) {
            if (amount <= 0) return;

            gameState.xp += amount;

            while (gameState.xp >= gameState.maxXp) {
                gameState.level += 1;
                gameState.xp -= gameState.maxXp;
                gameState.maxXp = Math.floor(gameState.maxXp * 1.5);
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
            }

            updateUI();
            saveState();
        }

        function addNewQuest() {
            const input = document.getElementById('questInput');
            const title = input.value.trim();

            if (!title) {
                showToast('❌ Saisis un nom de quête.');
                input.focus();
                return;
            }

            gameState.quests.push({
                id: makeId(),
                text: title,
                xpReward: 50,
                goldReward: 15,
                completed: false
            });

            input.value = '';
            renderQuestList();
            saveState();
            showToast('✅ Quête ajoutée !');
        }

        function deleteQuest(id) {
            gameState.quests = gameState.quests.filter((quest) => quest.id !== id);
            renderQuestList();
            saveState();
            showToast('🗑️ Quête supprimée.');
        }

        function completeQuest(id, xpReward) {
            const quest = gameState.quests.find((item) => item.id === id);
            if (!quest || quest.completed) return;

            quest.completed = true;
            gameState.gold += quest.goldReward || 15;
            addXp(xpReward || quest.xpReward || 50);
            renderQuestList();
            saveState();
            showToast(`✅ Quête terminée ! +${xpReward || quest.xpReward || 50} XP`);
        }

        function collectDailyReward() {
            const now = Date.now();
            const available = !gameState.dailyRewardAt || now >= gameState.dailyRewardAt;

            if (!available) {
                const remaining = gameState.dailyRewardAt - now;
                showToast(`⏳ Награду можно забрать через ${formatRemainingTime(remaining)}.`);
                return;
            }

            gameState.gold += 15;
            addXp(50);
            gameState.dailyRewardAt = now + DAILY_REWARD_MS;
            saveState();
            showToast('✅ Награда за посещение получена! +50 XP и +15 ОР');
        }

        function updateUI() {
            const proBadge = document.getElementById('pro-badge');
            const goldCount = document.getElementById('gold-count');
            const xpText = document.getElementById('xp-text');
            const xpBar = document.getElementById('xp-bar');
            const charTitle = document.getElementById('char-title');
            const buyProBtn = document.getElementById('buyProBtn');

            goldCount.textContent = String(gameState.gold);
            xpText.textContent = `${gameState.xp} / ${gameState.maxXp} XP`;
            xpBar.style.width = `${Math.min(100, (gameState.xp / gameState.maxXp) * 100)}%`;
            charTitle.textContent = `Niveau ${gameState.level} • Guerrier`;
            updateDailyRewardButton();

            if (gameState.isPro) {
                proBadge.textContent = 'PRO';
                proBadge.className = 'text-xs bg-amber-500 text-slate-950 font-bold px-2.5 py-0.5 rounded-full';
                buyProBtn.textContent = '👑 QuestLife PRO activé';
                buyProBtn.className = 'w-full mt-3 bg-gradient-to-r from-amber-400 to-orange-400 text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-orange-500/20 cursor-default';
                buyProBtn.disabled = true;
            } else {
                proBadge.textContent = 'Gratuit';
                proBadge.className = 'text-xs bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded-full';
                buyProBtn.textContent = '👑 Activer QuestLife PRO (200 🪙)';
                buyProBtn.className = 'w-full mt-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-orange-500/20';
                buyProBtn.disabled = false;
            }
        }

        function renderQuestList() {
            const questList = document.getElementById('quest-list');
            questList.innerHTML = '';

            if (gameState.quests.length === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'bg-dark-800 border border-dashed border-slate-700 p-3.5 rounded-xl text-sm text-slate-400 text-center';
                emptyItem.textContent = 'Aucune quête pour le moment. Ajoute une mission !';
                questList.appendChild(emptyItem);
                return;
            }

            for (const quest of gameState.quests) {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center bg-dark-800 border border-slate-700/50 p-3.5 rounded-xl shadow transition ${quest.completed ? 'opacity-50' : ''}`;

                const title = document.createElement('span');
                title.className = 'text-sm text-slate-100 pr-3';
                title.textContent = quest.text;

                const actions = document.createElement('div');
                actions.className = 'flex items-center gap-2';

                const completeBtn = document.createElement('button');
                completeBtn.type = 'button';
                completeBtn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition ${quest.completed ? 'bg-emerald-600 text-white cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`;
                completeBtn.textContent = quest.completed ? 'Validé ✓' : 'Terminer';
                completeBtn.disabled = quest.completed;
                completeBtn.addEventListener('click', () => completeQuest(quest.id, quest.xpReward));

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'text-slate-500 hover:text-red-400 font-bold px-1';
                removeBtn.textContent = '✕';
                removeBtn.setAttribute('aria-label', `Supprimer la quête ${quest.text}`);
                removeBtn.addEventListener('click', () => deleteQuest(quest.id));

                actions.appendChild(completeBtn);
                actions.appendChild(removeBtn);
                li.appendChild(title);
                li.appendChild(actions);
                questList.appendChild(li);
            }
        }

        function buyItem(cost, itemName) {
            if (gameState.gold < cost) {
                showToast('❌ Or insuffisant ! Accomplissez plus de quêtes.');
                return;
            }

            gameState.gold -= cost;
            saveState();

            if (itemName === 'Potion de Sagesse') {
                addXp(50);
                showToast(`🎉 Achat réussi : ${itemName} ! +50 XP`);
            } else {
                showToast(`🎉 Achat réussi : ${itemName} !`);
            }

            updateUI();
        }

        function buyProVersion() {
            if (gameState.isPro) {
                showToast('✅ Vous avez déjà QuestLife PRO.');
                return;
            }

            if (gameState.gold < 200) {
                showToast('❌ Il vous faut 200 pièces d\'or pour débloquer la version PRO !');
                return;
            }

            gameState.gold -= 200;
            gameState.isPro = true;
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
            updateUI();
            saveState();
            showToast('👑 Félicitations ! Vous avez activé QuestLife PRO.');
        }

        function resetProgress() {
            const shouldReset = window.confirm('Réinitialiser toute la progression ?');
            if (!shouldReset) return;

            localStorage.removeItem(STORAGE_KEY);
            gameState = getBaseState();
            renderQuestList();
            updateUI();
            showToast('🔄 Progression réinitialisée.');
        }

        document.getElementById('addQuestBtn').addEventListener('click', addNewQuest);
        document.getElementById('questInput').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                addNewQuest();
            }
        });

        document.getElementById('dailyRewardBtn').addEventListener('click', collectDailyReward);
        document.getElementById('reset-btn').addEventListener('click', resetProgress);
        document.getElementById('buyProBtn').addEventListener('click', buyProVersion);

        document.querySelectorAll('.buy-item').forEach((button) => {
            button.addEventListener('click', () => {
                const itemName = button.getAttribute('data-item');
                const cost = Number(button.getAttribute('data-cost'));
                buyItem(cost, itemName);
            });
        });

        renderQuestList();
        updateUI();
    </script>
</body>
</html>
