<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestLife - RPG To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen pb-20 md:pb-6">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- Шапка персонажа -->
        <header class="bg-dark-800 border border-slate-700 rounded-2xl p-4 shadow-lg mb-6">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <h1 id="char-title" class="text-xl font-black text-amber-400">Niveau 1 • Guerrier</h1>
                    <span id="pro-badge" class="text-xs bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded-full">Gratuit</span>
                </div>
                <div class="flex items-center gap-1 bg-dark-900 px-3 py-1.5 rounded-xl border border-slate-700">
                    <span class="text-amber-400 font-bold">🪙</span>
                    <span id="gold-count" class="font-bold text-amber-300">100</span>
                </div>
            </div>

            <!-- Шкала опыта -->
            <div>
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Expérience (XP)</span>
                    <span id="xp-text">0 / 100 XP</span>
                </div>
                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden p-0.5 border border-slate-600">
                    <div id="xp-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Создание квеста -->
        <section class="mb-6">
            <h2 class="text-lg font-bold mb-3 flex items-center gap-2">📜 Nouvelles Quêtes</h2>
            <div class="flex gap-2">
                <input type="text" id="questInput" placeholder="Nom de la nouvelle quête..." class="bg-dark-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white flex-1 focus:outline-none focus:border-indigo-500 text-sm">
                <button onclick="addNewQuest()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">Créer</button>
            </div>
        </section>

        <!-- Список квестов -->
        <section class="mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Quêtes Actives</h3>
            <ul id="quest-list" class="space-y-2">
                <li class="flex justify-between items-center bg-dark-800 border border-slate-700/50 p-3.5 rounded-xl shadow">
                    <span>Faire du sport (30 min)</span>
                    <div class="flex items-center gap-2">
                        <button onclick="completeQuest(this, 50)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold transition">Terminer</button>
                        <button onclick="deleteQuest(this)" class="text-slate-500 hover:text-red-400 font-bold px-1">✕</button>
                    </div>
                </li>
                <li class="flex justify-between items-center bg-dark-800 border border-slate-700/50 p-3.5 rounded-xl shadow">
                    <span>Lire 10 pages d'un livre</span>
                    <div class="flex items-center gap-2">
                        <button onclick="completeQuest(this, 40)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold transition">Terminer</button>
                        <button onclick="deleteQuest(this)" class="text-slate-500 hover:text-red-400 font-bold px-1">✕</button>
                    </div>
                </li>
            </ul>
        </section>

        <!-- Бонусная реклама -->
        <section class="mb-6">
            <button onclick="watchAdForReward()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                <span>🎁 Regarder une pub (+50 XP, +15 Or)</span>
            </button>
        </section>

        <!-- Магазин (Boutique) -->
        <section>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Boutique du Mage</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-dark-800 border border-slate-700 p-3.5 rounded-xl flex flex-col justify-between">
                    <div>
                        <div class="text-2xl mb-1">🧪</div>
                        <h4 class="font-bold text-sm">Potion de Sagesse</h4>
                        <p class="text-xs text-slate-400 mb-3">+50 XP instantané</p>
                    </div>
                    <button onclick="buyItem(30, 'Potion de Sagesse')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs transition">30 🪙</button>
                </div>
                <div class="bg-dark-800 border border-slate-700 p-3.5 rounded-xl flex flex-col justify-between">
                    <div>
                        <div class="text-2xl mb-1">⚔️</div>
                        <h4 class="font-bold text-sm">Épée Magique</h4>
                        <p class="text-xs text-slate-400 mb-3">Statut Légendaire</p>
                    </div>
                    <button onclick="buyItem(100, 'Épée Magique')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 rounded-lg text-xs transition">100 🪙</button>
                </div>
            </div>
            <button onclick="buyProVersion()" class="w-full mt-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-amber-500/20">
                👑 Activer QuestLife PRO (200 🪙)
            </button>
        </section>
    </div>

    <script>
        // Состояние игры
        let gameState = {
            xp: 0,
            maxXp: 100,
            level: 1,
            gold: 100,
            isPro: false
        };

        // Создание нового квеста из инпута
        function addNewQuest() {
            const input = document.getElementById('questInput');
            const title = input.value.trim();
            if (!title) return;

            const questList = document.getElementById('quest-list');
            const li = document.createElement('li');
            li.className = "flex justify-between items-center bg-dark-800 border border-slate-700/50 p-3.5 rounded-xl shadow";
            li.innerHTML = `<span>${title}</span> <div class="flex items-center gap-2"><button onclick="completeQuest(this, 50)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold transition">Terminer</button><button onclick="deleteQuest(this)" class="text-slate-500 hover:text-red-400 font-bold px-1">✕</button></div>`;
            questList.appendChild(li);
            
            input.value = '';
        }

        // Удаление квеста
        function deleteQuest(btn) {
            btn.closest('li').remove();
        }

        // Выполнение квеста
        function completeQuest(btn, xpReward) {
            const li = btn.closest('li');
            li.style.opacity = '0.5';
            btn.disabled = true;
            btn.innerText = 'Validé ✓';
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            btn.classList.add('bg-emerald-600');

            gameState.xp += xpReward;
            gameState.gold += 15;

            if (gameState.xp >= gameState.maxXp) {
                gameState.level++;
                gameState.xp -= gameState.maxXp;
                gameState.maxXp = Math.floor(gameState.maxXp * 1.5);
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
            }

            updateUI();
        }

        // Просмотр рекламы за награду
        function watchAdForReward() {
            alert("▶️ Simulation AdMob : Vous avez regardé la publicité et gagné +50 XP et +15 Or !");
            gameState.xp += 50;
            gameState.gold += 15;
            
            if (gameState.xp >= gameState.maxXp) {
                gameState.level++;
                gameState.xp -= gameState.maxXp;
                gameState.maxXp = Math.floor(gameState.maxXp * 1.5);
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
            }
            updateUI();
        }

        // Покупка товаров в магазине
        function buyItem(cost, itemName) {
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                alert(`🎉 Achat réussi : ${itemName} !`);
                if(itemName === 'Potion de Sagesse') {
                    gameState.xp += 50;
                    if (gameState.xp >= gameState.maxXp) {
                        gameState.level++;
                        gameState.xp -= gameState.maxXp;
                        gameState.maxXp = Math.floor(gameState.maxXp * 1.5);
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
                    }
                }
                updateUI();
            } else {
                alert("❌ Or insuffisant ! Accomplissez plus de quêtes.");
            }
        }

        // Покупка PRO версии
        function buyProVersion() {
            if (gameState.gold >= 200 || gameState.isPro) {
                if(!gameState.isPro) gameState.gold -= 200;
                gameState.isPro = true;
                document.getElementById('pro-badge').innerText = 'PRO';
                document.getElementById('pro-badge').className = 'text-xs bg-amber-500 text-slate-950 font-bold px-2.5 py-0.5 rounded-full';
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                alert("👑 Félicitations ! Vous avez activé QuestLife PRO.");
                updateUI();
            } else {
                alert("❌ Il vous faut 200 pièces d'or pour débloquer la version PRO !");
            }
        }

        // Обновление интерфейса на экране
        function updateUI() {
            document.getElementById('gold-count').innerText = gameState.gold;
            document.getElementById('xp-text').innerText = `${gameState.xp} / ${gameState.maxXp} XP`;
            document.getElementById('xp-bar').style.width = `${Math.min(100, (gameState.xp / gameState.maxXp) * 100)}%`;
            document.getElementById('char-title').innerText = `Niveau ${gameState.level} • Guerrier`;
        }
    </script>
